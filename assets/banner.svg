<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .flow-line { fill: none; stroke: url(#accentGrad); stroke-width: 2.5; stroke-dasharray: 8 6; animation: dash 25s linear infinite; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite alternate; }
    .node-orbit { animation: orbit 12s linear infinite; transform-origin: 600px 330px; }
    .badge-glow { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5)); }
    
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes pulse {
      0% { r: 5px; opacity: 0.4; }
      100% { r: 9px; opacity: 1; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .floating-card-1 { animation: floatCard 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard 7s ease-in-out 1s infinite; }
    .floating-card-3 { animation: floatCard 8s ease-in-out 2s infinite; }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Animated Network Grid Lines -->
  <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
  <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
  <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
  <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
  <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

  <line x1="200" y1="0" x2="200" y2="420" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="420" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="420" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="420" class="grid-line" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="300" r="160" fill="#ec4899" opacity="0.10" filter="blur(70px)" />
  <circle cx="600" cy="210" r="180" fill="#8b5cf6" opacity="0.08" filter="blur(80px)" />

  <!-- Dynamic Connecting Pipelines (Flows) -->
  <path d="M 50 330 C 250 330, 300 240, 500 240 C 700 240, 750 330, 950 330 C 1050 330, 1100 280, 1150 280" class="flow-line" />
  <path d="M 50 280 C 200 280, 250 360, 450 360 C 650 360, 750 260, 950 260 C 1050 260, 1120 340, 1150 340" class="flow-line" opacity="0.6" style="animation-direction: reverse;" />

  <!-- Animated Interactive / Pipeline Nodes -->
  <circle cx="250" cy="285" fill="#6366f1" class="pulse-circle" />
  <circle cx="500" cy="240" fill="#8b5cf6" class="pulse-circle" style="animation-delay: 0.8s;" />
  <circle cx="750" cy="295" fill="#ec4899" class="pulse-circle" style="animation-delay: 1.6s;" />
  <circle cx="950" cy="330" fill="#3b82f6" class="pulse-circle" style="animation-delay: 2.2s;" />

  <!-- Dynamic Feature Badges / Mini Cards (Positioned lower so title remains crystal clear) -->
  <g class="floating-card-1">
    <rect x="110" y="315" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.2" />
    <circle cx="138" cy="339" r="8" fill="#6366f1" />
    <text x="160" y="344" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">⚡ Event-Driven Flows</text>
  </g>

  <g class="floating-card-2">
    <rect x="490" y="315" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.2" />
    <circle cx="518" cy="339" r="8" fill="#8b5cf6" />
    <text x="540" y="344" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">🔗 6,000+ Connectors</text>
  </g>

  <g class="floating-card-3">
    <rect x="870" y="315" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.2" />
    <circle cx="898" cy="339" r="8" fill="#ec4899" />
    <text x="920" y="344" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">🛡️ Self-Host &amp; iPaaS</text>
  </g>

  <!-- Foreground Title and Branding Header (Always on Top & Crisp) -->
  <g text-anchor="middle">
    <!-- Category Tag -->
    <rect x="440" y="45" width="320" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <text x="600" y="64" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome No-Code Integration Platform
    </text>

    <!-- Highlighting Accent Underline -->
    <rect x="420" y="148" width="360" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Visual Workflow Automation • Enterprise iPaaS • Open-Source Orchestration Engines
    </text>
    
    <text x="600" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
      Zero-Code Connectivity • Event Triggers • Data Pipelines • API Integrations
    </text>
  </g>
</svg>
